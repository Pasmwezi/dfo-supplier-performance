services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DFO_SPM_DB_NAME:-dfo_spm}
      POSTGRES_USER: ${DFO_SPM_DB_USER:-dfo_spm}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DFO_SPM_DB_USER:-dfo_spm} -d ${DFO_SPM_DB_NAME:-dfo_spm}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    image: dfo-supplier-performance:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DFO_SPM_DB_HOST: postgres
      DFO_SPM_DB_PORT: "5432"
      DFO_SPM_DB_NAME: ${DFO_SPM_DB_NAME:-dfo_spm}
      DFO_SPM_DB_USER: ${DFO_SPM_DB_USER:-dfo_spm}
      DFO_SPM_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - backend
    logging: *default-logging

  bootstrap:
    image: dfo-supplier-performance:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.bootstrap"]
    restart: "no"
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DFO_SPM_DB_HOST: postgres
      DFO_SPM_DB_PORT: "5432"
      DFO_SPM_DB_NAME: ${DFO_SPM_DB_NAME:-dfo_spm}
      DFO_SPM_DB_USER: ${DFO_SPM_DB_USER:-dfo_spm}
      DFO_SPM_DB_PASSWORD_FILE: /run/secrets/db_password
      DFO_SPM_DEFAULT_ADMIN_USERNAME: ${DFO_SPM_DEFAULT_ADMIN_USERNAME:-admin}
      DFO_SPM_DEFAULT_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - db_password
      - admin_password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - backend
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dfo-supplier-performance:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      DFO_SPM_ENV: production
      DFO_SPM_DB_HOST: postgres
      DFO_SPM_DB_PORT: "5432"
      DFO_SPM_DB_NAME: ${DFO_SPM_DB_NAME:-dfo_spm}
      DFO_SPM_DB_USER: ${DFO_SPM_DB_USER:-dfo_spm}
      DFO_SPM_DB_PASSWORD_FILE: /run/secrets/db_password
      DFO_SPM_SCHEMA_MANAGEMENT: alembic
      DFO_SPM_BOOTSTRAP_ON_START: "false"
      DFO_SPM_PREPARE_ATTACHMENTS: "true"
      DFO_SPM_COOKIE_SECURE: "true"
      DFO_SPM_TRUSTED_HOSTS: ${APP_DOMAIN},localhost,app
      DFO_SPM_LOGIN_MAX_ATTEMPTS: "5"
      DFO_SPM_LOGIN_THROTTLE_SECONDS: "900"
    secrets:
      - db_password
    volumes:
      - attachments:/app/data/attachments
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; urllib.request.urlopen(sys.argv[1], timeout=3)", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - backend
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
        mode: host
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: udp
        mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - backend
      - frontend
    logging: *default-logging

secrets:
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password

volumes:
  postgres_data:
  attachments:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:

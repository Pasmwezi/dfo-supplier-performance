name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Compile
        run: python -m compileall -q app tests migrations
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f compose.production.yml config -q
      - name: Build production image
        run: docker build --tag supplier-performance:ci .
      - name: Validate deployment scripts
        run: bash -n deploy/backup.sh deploy/restore.sh deploy/docker-entrypoint.sh

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · SPM</title><link href="/static/app.css" rel="stylesheet"></head><body class="login-body"><main class="login-card"><div class="eyebrow">FIRST SIGN-IN SECURITY STEP</div><h1>Change your password</h1><p>Your temporary password must be replaced before you can access supplier performance information.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/change-password"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="12" autocomplete="new-password"><small>At least 12 characters with upper-case, lower-case, number and special character.</small></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label><button class="button primary" type="submit">Change password →</button></form></main></body></html>
